name: 'Archiving Report'
description: 'Finds and uploads test reports to Practitest'
inputs:
  lookup-folder:
    description: 'Base folder to archive'
    required: true
  build-title:
    description: 'Title to appear in the Test set runs'
    required: true
  project-id:
    description: 'Project ID'
    required: true
  status:
    description: 'Set the status of the build'
    required: false
    default: 0
  practitest-host:
    description: 'URL for Practitest'
    required: true
  practitest-api-host:
    description: 'URL for the Practitest API'
    required: true
  practitest-token:
    description: 'Token to access Practitest'
    required: true
  display-action-logs:
    description: 'More verbose if true'
    required: false
    default: true
  product-name:
    description: "One of the product names from Practitest, e.g. Analyzer or DataIntegration"
    required: true
  product-version:
    description: 'Release version, e.g. 10.2 or 10.2.0.2'
    required: true
  product-build:
    description: "Build number for the version, e.g. 123"
    required: true
  test-type:
    description: "One of the test case type options from Practitest, e.g. UI or Functional"
    required: true


runs:
  using: "composite"
  steps:
    - name: Get pracitest jar
      id: get-practitest-jar
      uses: robinraju/release-downloader@v1
      with:
        repository: 'PractiTest/practitest-firecracker'
        latest: true
        fileName: 'practitest-firecracker-*-standalone.jar'
        out-file-path: 'firecracker/practitest-firecracker-standalone.jar'

    - name: Upload Report
      shell: bash
      run: |
        echo '{
          "additional-test-fields": {
            "custom-fields": {
              "---f-54268": "${{ inputs.test-type }}",
              "---f-54359": "Regression"
            },
            "system-fields": {
              "status": "Ready"
            }
          },
          "additional-testset-fields": {
            "custom-fields": {
              "---f-55126": "QAT",
              "---f-54268": "${{ inputs.test-type }}",
              "---f-54254": "${{ inputs.product-name }}"
            },
            "system-fields": {
              "version": "${{ inputs.product-version }}"
            }
          },
          "additional-run-fields": {
            "custom-fields": {
              "---f-55488": "${{ inputs.product-build }}"
            },
            "system-fields": {
            }
          },
          "email": "practitest.admin@pentaho.com",
          "test-case-as-pt-test-step": false,
          "multitestset": false,
          "pt-test-name": "?pt-name-combine",
          "pt-test-step-name": "?test-case-name"
        }' > config.json
        cat ./config.json
        java -jar ${{ fromJson(steps.get-practitest-jar.outputs.downloaded_files)[0] }} \
        --reports-path="${{ inputs.lookup-folder }}" \
        --author-id=28862 \
        --api-uri="${{ inputs.practitest-api-host }}" \
        --display-action-logs="${{ inputs.display-action-logs }}" \
        --config-path=./config.json \
        --project-id="${{ inputs.project-id }}" \
        --testset-name="${{ inputs.build-title }}" \
        --api-token="${{ inputs.practitest-token }}" \
        create-and-populate-testset

    - name: Adding link on job summary
      if: always()
      shell: bash
      run: |
        LINK_TEXT="### [${{ inputs.build-title }}](${{ inputs.practitest-host }}/p/${{ inputs.project-id }}/sets) :rocket:"
        echo $LINK_TEXT\ >> $GITHUB_STEP_SUMMARY
        
        if [ -f ${{ inputs.lookup-folder }}/summary.txt ]; then
          echo "<pre>" >> $GITHUB_STEP_SUMMARY
          cat ${{ inputs.lookup-folder }}/summary.txt >> $GITHUB_STEP_SUMMARY
          echo "</pre>" >> $GITHUB_STEP_SUMMARY
        fi
